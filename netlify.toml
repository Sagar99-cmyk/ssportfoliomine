[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  VITE_API_URL = "https://chimerical-entremet-dc12c3.netlify.app/"
  VITE_IS_ADMIN = "true"

[[redirects]]
  from = "/api/*"
  to = "https://ssportfoliomine.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
